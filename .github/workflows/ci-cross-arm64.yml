name: CI - co-op ARM64 cross-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x86_64 with TLS
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake g++ libssl-dev ca-certificates
          mkdir -p build && cd build
          cmake -G "Unix Makefiles" \
            -DBUILD_SHARED_LIBS=ON -DDNP3_TESTS=OFF \
            -DDNP3_TLS=ON -DBUILD_CPP_EXAMPLES=ON \
            -DCMAKE_CXX_FLAGS="-Wno-error=deprecated-declarations" \
            ..
          make
          file examples/master/master-demo

  cross-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross toolchain
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake g++ \
            gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-user ca-certificates

      - name: Assemble aarch64 sysroot (apt-get download + dpkg -x)
        env:
          SYSDIR: ${{ github.workspace }}/sysroot
          DEBARCH: arm64
        run: |
          set -euo pipefail
          mkdir -p "$SYSDIR"
          # Pull the aarch64 runtime + dev packages as .deb files and unpack them
          # into a controlled sysroot prefix. apt-get download/dpkg -x never runs
          # cross dpkg (so no `dpkg --add-architecture` needed), and we ASSERT the
          # result is populated instead of relying on a best-effort loop.
          PKGS="libc6-dev libc6 libstdc++-14-dev g++-14-aarch64-linux-gnu \
                 gcc-14-aarch64-linux-gnu binutils-aarch64-linux-gnu \
                 libssl-dev libssl3 ca-certificates linux-libc-dev \
                 libc6-dev-arm64-cross libstdc++-14-dev"
          mkdir -p "$SYSDIR/debs"
          for p in $PKGS; do
            apt-get download --print-uris "$p" 2>/dev/null || true
          done
          for p in $PKGS; do
            apt-get download "$p" -o dir::cache=("$SYSDIR/debs") -o dir::cache::archives=("$SYSDIR/debs") 2>/dev/null || true
          done
          cd "$SYSDIR"
          # Unpack everything into the sysroot, best-effort per package.
          for d in debs/*.deb; do
            dpkg -x "$d" "$SYSDIR" 2>/dev/null || true
          done
          # ASSERT the sysroot is actually populated - a cross build against an
          # empty sysroot fails for an un-obvious reason, so fail loudly here.
          if [ ! -f "$SYSDIR/usr/lib/aarch64-linux-gnu/lib/libc.so.6" ] \
             && [ ! -f "$SYSDIR/usr/aarch64-linux-gnu/lib/libc.so.6" ]; then
            echo "ERROR: aarch64 sysroot assembled to $SYSDIR but no libc.so.6 found" >&2
            find "$SYSDIR" -name 'libc.so.6' 2>/dev/null || true
            exit 1
          fi

      - name: Build opendnp3 ARM64 cross
        env:
          AARCH64_SYSROOT: ${{ github.workspace }}/sysroot
        run: |
          set -euo pipefail
          export AARCH64_SYSROOT="${{ github.workspace }}/sysroot"
          export AARCH64_TRIPLET=aarch64-linux-gnu
          export AARCH64_CC=${AARCH64_TRIPLET}-gcc-14
          export AARCH64_CXX=${AARCH64_TRIPLET}-g++-14
          mkdir -p build-arm64 && cd build-arm64
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/cmake/arm64-toolchain.cmake" \
            -DBUILD_SHARED_LIBS=ON -DDNP3_TESTS=OFF -DDNP3_DTLS=OFF \
            /home/runner/work/coop-arm-dnp3-steward/cpp
          make

      - name: Smoke test under QEMU
        env:
          AARCH64_SYSROOT: ${{ github.workspace }}/sysroot
        run: |
          file build-arm64/examples/master/master-demo
          readelf -h build-arm64/examples/master/master-demo | grep -A1 Machine
          # libopendnp3.so lives in a non-standard dir; point QEMU at it.
          LD_LIBRARY_PATH="${{ github.workspace }}/build-arm64/cpp:\
             ${AARCH64_SYSROOT}/usr/lib/aarch64-linux-gnu:\
             ${AARCH64_SYSROOT}/usr/lib/x86_64-linux-gnu/libgcc-cross" \
          qemu-aarch64 ./build-arm64/examples/master/master-demo 5 0.5 || true
